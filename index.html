<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Free Rooms Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0c10;--surface:#12151b;--surface2:#1a1f2a;
  --border:#252b38;--accent:#4ade80;--accent-dim:rgba(74,222,128,0.12);
  --accent2:#facc15;--accent2-dim:rgba(250,204,21,0.1);
  --text:#eef0f3;--muted:#6b7280;--muted2:#374151;
  --font:'Space Grotesk',sans-serif;--mono:'JetBrains Mono',monospace;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden}
.hd{position:sticky;top:0;z-index:200;background:rgba(10,12,16,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:14px 16px 0}
.hd-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);flex-shrink:0;animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.75)}}
.hd-title{font-size:18px;font-weight:700;letter-spacing:-.4px}
.hd-title em{color:var(--accent);font-style:normal}
.hd-date{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:12px}
.days::-webkit-scrollbar{display:none}
.day-btn{flex-shrink:0;padding:6px 16px;border-radius:100px;font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:transparent;color:var(--muted);transition:all .15s;position:relative}
.day-btn:hover{border-color:var(--accent);color:var(--accent)}
.day-btn.active{background:var(--accent);border-color:var(--accent);color:#0a0c10}
.today-pip{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent)}
.search-bar{position:sticky;top:97px;z-index:150;background:rgba(10,12,16,0.97);padding:10px 16px;border-bottom:1px solid var(--border)}
.search-inner{position:relative}
.s-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--muted);pointer-events:none}
.search-input{width:100%;padding:10px 38px 10px 34px;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--mono);font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(74,222,128,0.07)}
.search-input::placeholder{color:var(--muted);font-family:var(--font);font-size:13px}
.s-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:2px 5px;display:none}
.s-clear.show{display:block}
.s-info{font-size:11px;color:var(--muted);margin-top:6px;min-height:15px;font-family:var(--mono)}
.now-bar{display:flex;align-items:center;gap:8px;margin:12px 16px 0;padding:9px 13px;border-radius:10px;font-size:12px;font-family:var(--mono)}
.now-bar.live{background:var(--accent-dim);border:1px solid rgba(74,222,128,.2);color:var(--accent)}
.now-bar.lunch{background:var(--accent2-dim);border:1px solid rgba(250,204,21,.2);color:var(--accent2)}
.blink{width:6px;height:6px;border-radius:50%;flex-shrink:0;animation:bl 1.4s ease-in-out infinite}
.live .blink{background:var(--accent)}.lunch .blink{background:var(--accent2)}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.15}}
.content{padding:14px 16px 100px}
.slot-sec{margin-bottom:22px;animation:up .25s ease both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.slot-hdr{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.slot-badge{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:7px;background:var(--surface2);border:1px solid var(--border);color:var(--text);white-space:nowrap}
.slot-badge.now{background:var(--accent2-dim);border-color:rgba(250,204,21,.4);color:var(--accent2)}
.now-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--accent2);color:#0a0c10;letter-spacing:.5px;font-family:var(--mono)}
.slot-cnt{font-size:11px;color:var(--muted);margin-left:auto;font-family:var(--mono);white-space:nowrap}
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:7px}
.room-card{display:flex;align-items:center;gap:7px;padding:9px 11px;background:var(--surface);border:1px solid var(--border);border-radius:9px;transition:all .15s;position:relative;overflow:hidden}
.room-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);border-radius:3px 0 0 3px}
.room-card:hover{border-color:rgba(74,222,128,.35);background:var(--surface2);transform:translateY(-1px)}
.ri{font-size:12px;flex-shrink:0;opacity:.55}
.rn{font-family:var(--mono);font-size:11.5px;font-weight:500;word-break:break-all;line-height:1.3;color:var(--text)}
.empty-msg{grid-column:1/-1;text-align:center;padding:18px;color:var(--muted);font-size:13px;border:1.5px dashed var(--border);border-radius:10px}
.no-results{text-align:center;padding:60px 20px;color:var(--muted)}
.no-results .icon{font-size:38px;margin-bottom:14px}
.no-results p{font-size:13px;line-height:1.7}
.no-results strong{color:var(--text)}
.footer{position:fixed;bottom:0;left:0;right:0;padding:10px 16px;background:rgba(10,12,16,0.97);backdrop-filter:blur(12px);border-top:1px solid var(--border);font-size:11px;color:var(--muted2);text-align:center;font-family:var(--mono)}
</style>
</head>
<body>
<div class="hd">
  <div class="hd-top">
    <div class="pulse"></div>

    <div class="hd-date" id="dateStr"></div>

</div>
<div class="search-bar">

    <input class="search-input" id="searchInput" type="search"

    <button class="s-clear" id="clearBtn" aria-label="Clear">×</button>
  </div>
  <div class="s-info" id="sInfo"></div>
</div>
<div id="nowBar"></div>
<div class="content" id="content"></div>

const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday'];
const SHORT={'Monday':'Mon','Tuesday':'Tue','Wednesday':'Wed','Thursday':'Thu','Friday':'Fri'};
let activeDay=todayName()||'Monday', searchQ='';
function todayName(){const d=new Date().getDay();return(d>=1&&d<=5)?DAYS[d-1]:null;}
function nowMins(){const n=new Date();return n.getHours()*60+n.getMinutes();}
function isNow(s,e){const n=nowMins();return n>=s&&n<=e;}
function isLunch(){const n=nowMins();return n>=710&&n<780;}
function renderDate(){document.getElementById('dateStr').textContent=new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});}
function renderTabs(){
  const today=todayName(),c=document.getElementById('dayTabs');
  c.innerHTML='';
  DAYS.forEach(day=>{
    const b=document.createElement('button');
    b.className='day-btn'+(day===activeDay?' active':'');
    b.textContent=SHORT[day];
    if(day===today){const p=document.createElement('span');p.className='today-pip';b.appendChild(p);}
    b.onclick=()=>{activeDay=day;clearSearch(false);renderAll();};
    c.appendChild(b);
  });
}
function renderNowBar(){
  const today=todayName(),el=document.getElementById('nowBar');
  if(activeDay!==today){el.innerHTML='';return;}
  const ts=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
  el.innerHTML=isLunch()
    ?`<div class="now-bar lunch"><div class="blink"></div>Lunch recess 11:50–13:00 · ${ts}</div>`
    :`<div class="now-bar live"><div class="blink"></div>Live · ${ts}</div>`;
}
function renderContent(){
  const slots=DATA[activeDay]||[],today=todayName();
  const q=searchQ.trim().toLowerCase().replace(/\s+/g,'');
  const el=document.getElementById('content'),infoEl=document.getElementById('sInfo');
  let html='',totalMatched=0,slotsShown=0;
  slots.forEach((slot,idx)=>{
    const isNowSlot=(activeDay===today)&&isNow(slot.start,slot.end);
    const visible=q?slot.rooms.filter(r=>r.toLowerCase().replace(/\s+/g,'').includes(q)):slot.rooms;
    if(q&&visible.length===0)return;
    totalMatched+=visible.length;slotsShown++;
    html+=`<div class="slot-sec" style="animation-delay:${(idx*0.04).toFixed(2)}s">
      <div class="slot-hdr">
        <span class="slot-badge${isNowSlot?' now':''}">⏱ ${slot.time}</span>
        ${isNowSlot?'<span class="now-tag">NOW</span>':''}
        <span class="slot-cnt">${visible.length} free</span>
      </div><div class="room-grid">`;
    if(slot.rooms.length===0){
      html+=`<div class="empty-msg">All rooms occupied in this slot</div>`;
    }else{
      visible.forEach(r=>{html+=`<div class="room-card"><span class="ri">🚪</span><span class="rn">${r}</span></div>`;});
    }
    html+=`</div></div>`;
  });
  if(q&&totalMatched===0){
    html=`<div class="no-results"><div class="icon">🔎</div><p>No free room matching<br><strong>"${searchQ}"</strong><br>on ${activeDay}.</p></div>`;
    if(infoEl)infoEl.textContent='No matches';
  }else if(q){
    if(infoEl)infoEl.textContent=`${totalMatched} room${totalMatched!==1?'s':''} matched across ${slotsShown} slot${slotsShown!==1?'s':''}`;
  }else{if(infoEl)infoEl.textContent='';}
  el.innerHTML=html;
}
function clearSearch(rerender=true){
  searchQ='';
  const inp=document.getElementById('searchInput');
  if(inp)inp.value='';
  document.getElementById('clearBtn').classList.remove('show');
  document.getElementById('sInfo').textContent='';
  if(rerender)renderContent();
}
function renderAll(){renderDate();renderTabs();renderNowBar();renderContent();}
document.addEventListener('DOMContentLoaded',()=>{
  renderAll();
  const inp=document.getElementById('searchInput');
  inp.addEventListener('input',e=>{
    searchQ=e.target.value;
    document.getElementById('clearBtn').classList.toggle('show',searchQ.length>0);
    renderContent();
  });
  inp.addEventListener('keydown',e=>{if(e.key==='Escape')clearSearch();});
});
setInterval(()=>{renderNowBar();renderContent();},60000);
</script>
